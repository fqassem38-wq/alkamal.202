<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة الكمال - سحب الهدايا</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --p: #e94560; 
            --gold: #ffd700; 
            --mint: #1abc9c; 
            --dark-blue: #1a1a2e;
        }

        body { 
            margin: 0; background: var(--dark-blue); color: white; 
            font-family: 'Cairo', sans-serif; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden; 
        }

        #lock-screen { 
            position: fixed; inset: 0; background: var(--dark-blue); 
            z-index: 2000; display: none; flex-direction: column; 
            align-items: center; justify-content: center; text-align: center; padding: 30px; 
        }

        .lock-card {
            background: #16213e; padding: 40px; border-radius: 20px;
            border: 2px solid var(--p); box-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
        }

        #game-content { text-align: center; width: 100%; max-width: 450px; }
        
        .w-box { 
            position: relative; width: 320px; height: 320px; 
            margin: 20px auto; border: 8px solid #fff; 
            border-radius: 50%; box-shadow: 0 0 50px rgba(0,0,0,0.5); 
        }
        
        .arrow { 
            position: absolute; top: -35px; left: 50%; 
            transform: translateX(-50%); width: 0; height: 0; 
            border-left: 15px solid transparent; border-right: 15px solid transparent; 
            border-top: 40px solid var(--p); z-index: 100; 
        }

        canvas { width: 100%; height: 100%; border-radius: 50%; transition: transform 5s cubic-bezier(0.2, 0, 0.1, 1); }
        
        .logo-center { 
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); width: 70px; height: 70px; 
            background: white; border-radius: 50%; z-index: 110; 
            border: 4px solid var(--mint); display: flex; align-items: center; justify-content: center; 
        }
        
        button { 
            padding: 12px 50px; background: linear-gradient(45deg, var(--p), #ff6b6b); 
            color: white; border: none; border-radius: 50px; 
            font-size: 20px; font-weight: 900; cursor: pointer; transition: 0.3s;
        }

        button:disabled { background: #555; cursor: not-allowed; }
        #st { margin-top: 20px; font-size: 22px; font-weight: bold; min-height: 30px; }
    </style>
</head>
<body>

    <div id="lock-screen"><div class="lock-card" id="lock-msg"></div></div>

    <div id="game-content">
        <h2 style="color: var(--gold); margin-bottom: 5px;">✨ مكتبة الكمال ✨</h2>
        <div class="w-box">
            <div class="arrow"></div>
            <div class="logo-center"><img src="logo/alkamal.png" alt="Logo" style="width:75%" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3342/3342137.png'"></div>
            <canvas id="cv" width="600" height="600"></canvas>
        </div>
        <button id="btn" onclick="spin()">إبدأ السحب الآن</button>
        <div id="st"></div>
    </div>

    <audio id="spinSnd" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>
    <audio id="winSnd" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

    <script>
        // مصفوفة الجوائز (الترتيب هنا هو ترتيب الرسم على العجلة)
        const prizes = [
            { n: "قسيمة 25,000", id: "100", isWin: true, c: "#e94560" },
            { n: "قسيمة 5,000", id: "200", isWin: true, c: "#1abc9c" },
            { n: "كوب هدية", id: "110", isWin: true, c: "#f39c12" },
            { n: "سيت قلم جاف", id: "120", isWin: true, c: "#9b59b6" },
            { n: "ممحاة", id: "130", isWin: true, c: "#3498db" },
            { n: "دفتر", id: "140", isWin: true, c: "#27ae60" },
            { n: "حظ أوفر", id: "default", isWin: false, c: "#1a1a2e" }
        ];
        
        const urlParams = new URLSearchParams(window.location.search);
        const codeId = urlParams.get('id');

        function init() {
            if (!codeId) {
                document.getElementById('lock-msg').innerHTML = "<h2>⚠️ خطأ</h2><p>يرجى مسح الكود من الوصل.</p>";
                document.getElementById('lock-screen').style.display = "flex";
                return;
            }
            if (localStorage.getItem('bk_used_' + codeId)) {
                document.getElementById('lock-msg').innerHTML = `<h2>❌ عذراً</h2><p>الكود (${codeId}) مستخدم مسبقاً.</p>`;
                document.getElementById('lock-screen').style.display = "flex";
                return;
            }
            draw();
        }

        function draw() {
            const cv = document.getElementById('cv');
            const ctx = cv.getContext('2d');
            const seg = (Math.PI * 2) / prizes.length;
            ctx.clearRect(0,0,600,600);
            for (let i = 0; i < prizes.length; i++) {
                const angle = i * seg;
                ctx.beginPath(); ctx.fillStyle = prizes[i].c; ctx.moveTo(300, 300);
                ctx.arc(300, 300, 300, angle, angle + seg); ctx.fill();
                ctx.save(); ctx.translate(300, 300); ctx.rotate(angle + seg / 2);
                ctx.textAlign = "right"; ctx.fillStyle = "#ffffff";
                ctx.font = "bold 20px 'Cairo'"; ctx.fillText(prizes[i].n, 280, 10); ctx.restore();
            }
        }

        function spin() {
            const btn = document.getElementById('btn');
            btn.disabled = true;

            // تحديد الجائزة بناء على ID
            let winIdx = prizes.findIndex(p => p.id === codeId);
            if (winIdx === -1) winIdx = prizes.findIndex(p => p.id === "default");

            const degPerSeg = 360 / prizes.length;
            
            // الحساب الصحيح:
            // 1. العجلة ترسم القطاع الأول (0) عند الساعة 3.
            // 2. السهم عند الساعة 12 (الزاوية 270).
            // 3. لإحضار القطاع رقم X إلى السهم، نحتاج لتدوير العجلة بزاوية تجعله عند 270.
            const targetAngle = (winIdx * degPerSeg) + (degPerSeg / 2);
            const rotationNeeded = 270 - targetAngle;
            const totalSpin = 3600 + rotationNeeded; // 3600 هي 10 دورات كاملة للتشويق

            const canvas = document.getElementById('cv');
            canvas.style.transform = `rotate(${totalSpin}deg)`;
            document.getElementById('spinSnd').play().catch(()=>{});

            setTimeout(() => {
                const p = prizes[winIdx];
                const st = document.getElementById('st');
                localStorage.setItem('bk_used_' + codeId, Date.now());

                if (p.isWin) {
                    st.innerHTML = `<span style="color:var(--gold)">🎊 مبروك! فزت بـ ${p.n} 🎊</span>`;
                    document.getElementById('winSnd').play().catch(()=>{});
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                } else {
                    st.innerHTML = `<span style="color:#eee">حظ أوفر المرة القادمة</span>`;
                }
                
                setTimeout(() => {
                    alert(p.isWin ? "جائزتك: " + p.n : "شكراً لمشاركتك!");
                    location.reload(); 
                }, 4000);
            }, 5000);
        }

        window.onload = init;
    </script>
</body>
</html>

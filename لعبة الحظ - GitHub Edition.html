<html lang="ar" dir="rtl"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الحظ - GitHub Edition</title>
    <script src="./لعبة الحظ - GitHub Edition_files/firebase-app-compat.js.download"></script>
    <script src="./لعبة الحظ - GitHub Edition_files/firebase-database-compat.js.download"></script>
    <style>
        :root { --p: #e94560; --s: #16213e; --b: #1a1a2e; --t: #ffffff; }
        body { margin:0; background:var(--b); color:var(--t); font-family:sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; overflow:hidden; }
        #scr { position:fixed; inset:0; background:var(--b); z-index:99; display:flex; align-items:center; justify-content:center; text-align:center; font-size:20px; padding:20px; }
        #game { display:none; text-align:center; }
        .w-c { position:relative; width:340px; height:340px; border:10px solid var(--s); border-radius:50%; margin:20px auto; }
        canvas { width:100%; height:100%; border-radius:50%; transition: transform 4s cubic-bezier(0.1, 0, 0.1, 1); }
        #a { position:absolute; top:-20px; left:50%; transform:translateX(-50%); border-left:15px solid transparent; border-right:15px solid transparent; border-top:35px solid var(--p); z-index:10; }
        button { padding:15px 40px; background:var(--p); color:white; border:none; border-radius:8px; font-size:20px; font-weight:bold; cursor:pointer; }
        button:disabled { background:#555; }
        #st { margin-top:20px; font-size:22px; font-weight:bold; color:#FFD700; }
    </style>
</head>
<body>

    <div id="scr">⚠️ عذراً! الرابط غير مكتمل.<br>يجب إضافة معرف الكود في النهاية.</div>

    <div id="game">
        <div class="w-c">
            <div id="a"></div>
            <canvas id="cv" width="500" height="500"></canvas>
        </div>
        <button id="btn" onclick="spin()">ابدأ السحب</button>
        <div id="st"></div>
    </div>

    <script>
        // 1. ضع بياناتك هنا (تأكد من دقتها 100%)
        const firebaseConfig = {
            apiKey: "AIzaSy...", 
            authDomain: "your-project.firebaseapp.com",
            databaseURL: "https://your-project-default-rtdb.firebaseio.com",
            projectId: "your-project",
            storageBucket: "your-project.appspot.com",
            appId: "..."
        };

        // تهيئة Firebase
        try {
            firebase.initializeApp(firebaseConfig);
        } catch (e) {
            document.getElementById('scr').innerText = "خطأ في تهيئة Firebase. تأكد من الإعدادات.";
        }

        const db = firebase.database();
        const urlParams = new URLSearchParams(window.location.search);
        const codeId = urlParams.get('id');

        const prizes = [
            { n: "قسيمة 25000", w: 1 }, { n: "قسيمة 5000", w: 5 }, { n: "كوب", w: 7 }, 
            { n: "قلم جاف", w: 10 }, { n: "دفتر", w: 20 }, { n: "ممحاة", w: 25 }, { n: "حظ أوفر", w: 32 }
        ];
        const clr = ["#FFD700", "#2ecc71", "#3498db", "#9b59b6", "#e67e22", "#1abc9c", "#34495e"];
        let rot = 0;

        async function init() {
            // التحقق من وجود الكود في الرابط
            if (!codeId) {
                document.getElementById('scr').innerHTML = "⚠️ عذراً! الرابط غير مكتمل.<br>يجب إضافة معرف الكود في النهاية.";
                return;
            }

            const idNum = parseInt(codeId);
            if (idNum < 200 || idNum > 300) {
                document.getElementById('scr').innerHTML = "⚠️ الكود خارج النطاق المسموح (200-300).";
                return;
            }

            try {
                // فحص قاعدة البيانات
                const snapshot = await db.ref('used/' + codeId).get();
                if (snapshot.exists()) {
                    document.getElementById('scr').innerHTML = "❌ هذا الكود تم استخدامه سابقاً!";
                } else {
                    document.getElementById('scr').style.display = 'none';
                    document.getElementById('game').style.display = 'block';
                    draw();
                }
            } catch (error) {
                console.error(error);
                document.getElementById('scr').innerHTML = "⚠️ فشل الاتصال بقاعدة البيانات.<br>تأكد من الـ Rules في Firebase.";
            }
        }

        function draw() {
            const ctx = document.getElementById('cv').getContext('2d');
            const seg = (Math.PI * 2) / 7;
            for (let i = 0; i < 7; i++) {
                ctx.beginPath(); ctx.fillStyle = clr[i]; ctx.moveTo(250, 250);
                ctx.arc(250, 250, 250, i * seg, (i+1) * seg); ctx.fill();
                ctx.save(); ctx.translate(250, 250); ctx.rotate(i * seg + seg/2);
                ctx.textAlign="right"; ctx.fillStyle="#fff"; ctx.font="bold 20px Arial";
                ctx.fillText(prizes[i].n, 230, 10); ctx.restore();
            }
        }

        async function spin() {
            document.getElementById('btn').disabled = true;
            
            const pool = [];
            prizes.forEach((p, i) => { for(let j=0; j<p.w; j++) pool.push(i); });
            const winIdx = pool[Math.floor(Math.random() * pool.length)];

            const segDeg = 360 / 7;
            const targetDeg = (360 - (winIdx * segDeg) - (segDeg / 2) + 270) % 360;
            rot = 3600 + targetDeg; 
            
            document.getElementById('cv').style.transform = `rotate(${rot}deg)`;

            setTimeout(async () => {
                const prizeName = prizes[winIdx].n;
                document.getElementById('st').innerText = "النتيجة: " + prizeName;
                
                // حفظ النتيجة في السحابة
                try {
                    await db.ref('used/' + codeId).set({
                        status: "used",
                        prize: prizeName,
                        date: new Date().toLocaleString()
                    });
                } catch (e) {
                    alert("تحذير: لم يتم تسجيل النتيجة في السحابة، تأكد من إعدادات القواعد!");
                }
            }, 4000);
        }

        // تشغيل الفحص عند تحميل الصفحة
        window.onload = init;
    </script>
